worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 4096; multi_accept on; use epoll; }
http {
  access_log off;
  error_log /dev/stderr warn;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 75s;
  server_tokens off;
  client_max_body_size 10m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080 default_server;
    __EXTRA_LISTEN__
    server_name _;

    location = /jinx-health {
      proxy_pass http://127.0.0.1:8000/dashboard/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_read_timeout 5s;
    }
    location = / { return 302 /dashboard/; }

    # VLESS + WebSocket. The public Railway edge terminates HTTPS.
    location = __WS_PATH__ {
      if ($http_upgrade !~* "websocket") { return 404; }
      proxy_pass http://127.0.0.1:10001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    # Marzban dashboard, API, and subscription URLs.
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
